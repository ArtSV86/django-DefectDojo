name: CI / Безопасный пайплайн

on:
  push:
    branches: [ ci-cd-security-pipeline ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # --- ЭТАП 1: SAST (CodeQL) ---
  run_sast:
    name: "SAST (CodeQL)"
    runs-on: ubuntu-latest
    outputs:
      sast_status: ${{ steps.analyze.outputs.result }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild for CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3

  # --- ЭТАП 2: DAST (ZAP) ---
  run_dast:
    name: "DAST (ZAP)"
    needs: run_sast
    runs-on: ubuntu-latest
    outputs:
      dast_status: ${{ steps.run-zap.outputs.status }}
      report_path: ${{ steps.run-zap.outputs.report }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ZAP Baseline Scan using Docker
        id: run-zap
        env:
          TARGET_URL: https://django-defectdojo-5qhb.onrender.com
        run: |
          echo "Запуск сканирования ZAP..."
          timeout 2m docker run --rm -v ${{ github.workspace }}:/zap/wrk/:rw owasp/zap2docker-stable zap-baseline.sh \
            -t ${{ env.TARGET_URL }} \
            -r /zap/wrk/scan-report.html \
            -x /zap/wrk/scan-report.xml \
            -f openapi -m 1 || true

          if [ -f "/zap/wrk/scan-report.xml" ]; then
            echo "Сканирование завершено."
            echo "::set-output name=status::success"
            echo "::set-output name=report::scan-report.xml"
          else
            echo "Ошибка: Сайт недоступен или сканирование не завершилось."
            echo "::set-output name=status::action_required"
            echo "::set-output name=report::"
          fi

      - name: Upload DAST Report (if exists)
        if: steps.run-zap.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DAST-Report
          path: scan-report.html

  # --- ЭТАП 3: Security Checks (Secrets & Dependencies) ---
  security_checks:
    name: "Security Checks"
    needs: [run_sast, run_dast]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies and Prepare Data
        run: |
          python -m pip install --upgrade pip setuptools wheel psycopg2-binary
          pip install -r requirements.txt
          # Исправленная команда для запуска фикстуры через python
          python scripts/fixture-updater.py dojo/fixtures/defect_dojo_sample_data.json

      - name: Scan for Secrets (gitleaks)
        uses: zricethezav/gitleaks-action@v3.0.0
        with:
          args: --verbose --redact

      - name: Install and Run pip-audit
        run: |
          python -m pip install pip-audit
          python -m pip audit

  # --- ЭТАП 4: Security Gateway (Блокировка релиза) ---
  security_gateway:
    name: "Security Gateway"
    needs: [run_sast, run_dast]
    runs-on: ubuntu-latest
    if: ${{ needs.run_sast.outputs.sast_status == 'success' && needs.run_dast.outputs.dast_status == 'success' }}

    steps:
      - name: Check for Critical Issues and Fail Build
        id: check_issues
        run: |
          echo "Проверка на критические уязвимости..."
          
          ISSUES_FOUND=$(grep -E "Critical|High" /zap/wrk/scan-report.xml || true)
          
          if [ -n "$ISSUES_FOUND" ]; then
              echo "Критические уязвимости найдены. Блокировка релиза."
              echo "::error ::Security Gateway failed: Критические уязвимости найдены в результатах DAST."
              exit 1 
          else
              echo "Критических уязвимостей не обнаружено."
              exit 0 
          fi
